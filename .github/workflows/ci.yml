name: CI

# The check roster, run on the pull request rather than after the merge.
#
# `deploy.yml` runs these too, but it triggers on `push` to `main` — so until
# this existed, every check ran *after* the merge had already happened. A pull
# request that broke a guard merged clean and the failure then landed on `main`,
# blocking the Pages deploy with the bad commit already in history. That is not
# hypothetical: the audit branch broke `test:metrics` (the wound/bleed/fear
# riders were being skipped on nearly every landed hit, halving the run's
# bleeding rate) and only a local run caught it.
#
# Deliberately a separate workflow rather than a `pull_request` trigger added to
# `deploy.yml`: that file holds `pages: write` and `id-token: write`, the
# `pages` concurrency group and the `deploy` job, and none of those should be
# reachable from a pull request. This one only reads the repository.
#
# AUDIT-6 §1.1: `test:ui` is here now, as its own job.
#
# It used to be excluded because it needs `npm run dev` on port 3000 and a
# Playwright browser download — true, and the wrong conclusion. Nothing else in
# this workflow executes a single line of `src/components` or `src/screens`, so
# 13,000 lines of interface had no gate on any pull request. The cost of that was
# measured rather than argued: **24 of the harness's 46 steps were failing on
# `main`**, every one of them a stale assertion following an intentional UI
# change, and a genuine regression in the arena screen, the tribute sheet, the
# Gamemaker booth or the phone layout would have been indistinguishable from the
# wall of red. A harness nobody runs decays into one nobody can read.
#
# Separate job so a browser download never blocks the simulation checks, and so
# the two failure modes are told apart at a glance.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A second push to the same branch supersedes the first; nothing here has a
# side effect worth finishing once it is known to be stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The build chain is what deploys; a high-severity advisory in it is a
      # release blocker, so it fails here too rather than only at deploy time.
      - run: npm audit --audit-level=high
      # AUDIT-7 §1.10: `lint` is `tsc --noEmit && eslint .` now. It was tsc
      # alone, with no ESLint dependency and no config, while thirteen
      # `eslint-disable react-hooks/exhaustive-deps` comments sat in the
      # interface suppressing a rule that was not running. Two of the thirteen
      # turned out to be suppressing nothing at all.
      - run: npm run lint

      # Balance discipline, both directions: no declared knob goes unread, and
      # no new tunable is typed into the engine instead of into data/balance.ts.
      - run: npm run test:knobs
      - run: npm run test:undeclared-knobs

      # The simulation itself.
      - run: npm run test:sim
      - run: npm run test:metrics
      - run: npm run test:decisions
      # AUDIT-9: the cause-code taxonomy has to stay complete as the prose
      # moves, or the measurements that key off it go quietly blind.
      - run: npm run test:causes
      - run: npm run test:scenarios
      # AUDIT-9 batches 1 and 2: one failure fixture per repaired defect.
      # These are the audit's own reproductions turned around, so a failure
      # here is a named defect from section 2 coming back rather than a
      # drifting aggregate.
      - run: npm run test:audit10
      # AUDIT-9 batch 3: the behaviour changes, as positioned scenes. A win
      # rate cannot say whether a mechanism fires; these can.
      - run: npm run test:batch3
      # AUDIT-9 batch 4: the three content pilots. A sweep can show a chain
      # firing; it cannot show that a branch which never came up is rare
      # rather than dead, and two of them were dead when written.
      - run: npm run test:batch4
      - run: npm run test:audit10-fixes
      # AUDIT-10 batch 2: the shared legal-action contract. "Validated twice"
      # is not something a reader can check by inspection.
      - run: npm run test:actions
      # REQUEST: bodies weighted by rarity, district and age. A distribution is
      # the one thing a positioned scene cannot check.
      - run: npm run test:bodies
      # REQUEST: how a Games ends — victor health and whether the last death
      # is a showdown. Both are distributions, not propositions about one run.
      - run: npm run test:endgame
      # REQUEST: the death settings are counts. "Absolute" is a claim about the
      # whole slider, so it is checked across its range rather than at its default.
      - run: npm run test:death-targets
      # REQUEST: a fixed Games. The outcome is the easy half; the hard half is
      # that every other death in it is still a real, attributed, ordered death.
      - run: npm run test:rigged
      # B3-03: an achievement must survive the save falling back to a short
      # chronicle tail. The migrated entries are guarded; the rest are listed.
      - run: npm run test:milestones
      # B3-02: the wound ledger is a second account of what the simulation did,
      # so it is only worth having if it cannot disagree with the first.
      - run: npm run test:wounds
      # B3-01: a link that says it replays a run has to replay it. The guard
      # fires real Gamemaker commands and compares the outcomes.
      - run: npm run test:replay
      # B4-02: the funnel's own precondition — an instrument that changes what
      # it measures is not an instrument. The report asserts it before printing.
      - run: npm run funnel
      # B5-02: a forecast due on the cycle it is announced is a log line, not an
      # intervention window. Also reports how many hazards arrive unannounced.
      - run: npm run test:warnings
      # B5-01: "a liar can be a reliable shield" is only true if the axes can
      # come apart, so that is asserted rather than assumed.
      - run: npm run test:credibility
      # B5-03: two wounded, one kit. Asserts the split, and that the kit
      # physically moves rather than being copied.
      - run: npm run test:triage
      # B5-01: a shared decision needs a room that can disagree and a proposal
      # that can lose, or it is a dice roll with minutes attached.
      - run: npm run test:hearings
      # B5-02: a half-built shelter belongs to the place, so somebody else can
      # find it, finish it, or inherit it from the dead.
      - run: npm run test:projects
      # §16: an objective kind nobody ever holds is content that reads as
      # shipped. Asserts a floor and a ceiling on each of the five new ones.
      - run: npm run test:intentions
      # §16: a crossing makes a sound. The ceiling is the real assertion —
      # sound that carries too well deletes stealth, hiding and every ambush.
      - run: npm run test:noise
      # B5-01 §16: who is said to have killed whom. The ceiling again — a claim
      # that spreads without friction turns the arena into a lynch mob.
      - run: npm run test:accusations

      # Content and structure.
      - run: npm run test:arenas
      - run: npm run test:arena-layout
      - run: npm run test:zone-features
      - run: npm run test:flavor
      - run: npm run test:names
      - run: npm run test:achievements
      - run: npm run test:predicates
      # AUDIT-8 §1.5: a string in one data table that is supposed to name a row
      # in another. Unguarded until now, and `broker.preferredTraits` listed
      # 'HardBargain' against a trait called 'Hard Bargain' for eight audits —
      # issued to 174 tributes per 1,600 Games and rendered to the player as
      # "No recorded effect." Runs in under a second; touches no simulation.
      - run: npm run test:references

      # Saves written by an older build must still open.
      - run: npm run test:storage

      - run: npm run build

  # AUDIT-7 §8.7: the balance numbers, at the sample size that can judge them.
  #
  # `test:metrics` runs at 400 runs in the job above, which is the right cost
  # for a pull request and the wrong sample for half of what it measures. At
  # 400 runs not one of the 29 archetypes clears GUARD_MIN_SAMPLE and two of
  # the 86 reaping traits do, so the archetype rows abstain and — until §1.6 —
  # the trait row printed a verdict on a population of two. The numbers the
  # design targets are written against (archetype spread 2.36x, trait spread
  # 2.20x) only exist at 1,600.
  #
  # AUDIT-8 §1.1: it runs on pull requests too now.
  #
  # It used to be `if: github.event_name == 'push'`, on the argument that "a
  # merge is where a balance regression needs catching". A merge is where one
  # gets *found*, which is a different thing and is one merge too late: the
  # `quiet` signature shipped under a 29% floor at 4.5%, every PR that touched
  # it went green because all thirty-five archetypes are under `GUARD_MIN_SAMPLE`
  # at 400 runs, and `main` then sat red across two commits with the bad commit
  # already in history — the precise failure this workflow's own header says it
  # was created to prevent.
  #
  # The cost is a few minutes on a job that runs in parallel with `check` and
  # blocks nothing else.
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Balance at the sample size that can judge it
        run: METRICS_RUNS=1600 npm run test:metrics

  # The interface, in a real browser. Everything under src/components and
  # src/screens is invisible to every check in the job above.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The static interface checks. Cheap, and they ratchet: hover-only hints
      # on controls, value hints with no accessible name, and unnamed values.
      - run: npm run test:ui-affordances
      - run: npm run test:unnamed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the dev server
        run: |
          npm run dev &
          npx wait-on http://localhost:3000/survival-games/ --timeout 120000
      # Drives every screen, tab, dialog and keyboard shortcut, fails on any
      # console or page error, and censuses tap targets at 380px.
      - run: npm run test:ui
      # AUDIT-9 batch 3: the text-size preference across every setting, at
      # phone and desktop width, inside a live run. The audit could not launch
      # a browser, so B16 shipped as a static finding; this is the acceptance
      # pass, and it found three real defects the single-viewport measurement
      # missed.
      - run: npm run test:textscale
